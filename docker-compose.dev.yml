# Base PostgreSQL de développement (Windows, macOS, Linux) : npm run db:start
services:
  postgres-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - pg-dev:/var/lib/postgresql/data
      - ./deploy/init-db-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
volumes:
  pg-dev:
