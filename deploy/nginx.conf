server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 40m;

  # Sécurité : en-têtes de base (TLS terminé par le répartiteur de charge ou Caddy en frontal)
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ws/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }
  # Segments vidéo : cache court côté CDN / navigateur, URLs signées
  location /media/ {
    proxy_pass http://api:3000;
    proxy_buffering on;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
